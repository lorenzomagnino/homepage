name: Update download count

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch total downloads and update page
        run: |
          COUNT=$(curl -sf "https://img.shields.io/pepy/dt/bench-mfg-suite.json" | jq -r '.value')
          # shields may abbreviate (e.g. "1.2k") — accept that form, reject junk
          if ! [[ "$COUNT" =~ ^[0-9][0-9.,kKmM]*$ ]]; then echo "Bad count: '$COUNT'"; exit 1; fi
          sed -i -E "s|(data-downloads>)[^<]*|\1${COUNT}|" repositories.html

      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "No change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Update Bench-MFG download count"
          git push
