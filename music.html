<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Music | Lorenzo Magnino</title>
    <meta name="description" content="Music - Lorenzo Magnino">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'zen-cream': '#F0EEE6',
                        'zen-ink': '#333333',
                        'zen-accent': '#535146',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html {
            scroll-behavior: smooth;
        }
        
        body {
            background-color: #F0EEE6;
            color: #333333;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* The Canvas Background */
        #neural-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
        }

        /* Minimalist Cards */
        .minimal-panel {
            background: rgba(240, 238, 230, 0.6);
            border: 1px solid rgba(51, 51, 51, 0.1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
        }

        /* Animations */
        .fade-in-up {
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Video Stack Container */
        .video-stack-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 400px;
            margin: 0 auto;
        }

        .video-stack-item {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(51, 51, 51, 0.1);
            box-shadow: 0 14px 28px rgba(51, 51, 51, 0.14);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .video-stack-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Stack positioning - each video slightly offset */
        .video-stack-item:nth-child(1) {
            z-index: 3;
            transform: translate(0, 0) scale(1);
        }

        .video-stack-item:nth-child(2) {
            z-index: 2;
            transform: translate(20px, 20px) scale(0.95);
            opacity: 0.9;
        }

        .video-stack-item:nth-child(3) {
            z-index: 1;
            transform: translate(40px, 40px) scale(0.9);
            opacity: 0.8;
        }

        /* Active state - bring to front */
        .video-stack-item.active {
            z-index: 10;
            transform: translate(0, 0) scale(1) !important;
            opacity: 1 !important;
        }

        /* Hover effect - only on visible neighbors */
        .video-stack-item.visible-neighbor:hover {
            transform: translate(10px, 10px) scale(0.98);
        }

        /* Navigation dots */
        .video-nav-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
        }

        .video-nav-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: rgba(51, 51, 51, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .video-nav-dot.active {
            background-color: #333333;
            width: 24px;
            border-radius: 4px;
        }

        /* Navigation arrows */
        .video-nav-arrows {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 20px;
        }

        .video-nav-arrow {
            width: 36px;
            height: 36px;
            background-color: rgba(240, 238, 230, 0.9);
            border: 1px solid rgba(51, 51, 51, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .video-nav-arrow:hover:not(:disabled) {
            background-color: rgba(51, 51, 51, 0.1);
            border-color: rgba(51, 51, 51, 0.4);
        }

        .video-nav-arrow:active:not(:disabled) {
            transform: scale(0.95);
        }

        .video-nav-arrow svg {
            width: 16px;
            height: 16px;
            stroke: #333333;
        }

        .video-nav-arrow:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .video-nav-arrow:disabled:hover {
            background-color: rgba(240, 238, 230, 0.9);
            border-color: rgba(51, 51, 51, 0.2);
        }

        /* Custom selection styles */
        ::selection {
            background: #333333;
            color: #F0EEE6;
        }

        .hover-underline {
            display: inline-block;
            position: relative;
        }
        .hover-underline::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: #333333;
            transform-origin: bottom right;
            transition: transform 0.25s ease-out;
        }
        .hover-underline:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 md:p-12">

    <!-- Interactive Background -->
    <canvas id="neural-canvas"></canvas>

    <!-- Main Container -->
    <main class="w-full max-w-6xl relative z-10 fade-in-up" style="animation-delay: 0.2s;">
        
        <!-- Back to Home Link -->
        <div class="mb-8">
            <a href="index.html" class="inline-flex items-center space-x-2 text-zen-ink/70 hover:text-zen-ink transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span class="font-mono text-sm uppercase tracking-widest hover-underline">Back to Home</span>
            </a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-24">
            
            <!-- LEFT COLUMN: Text -->
            <div class="lg:col-span-5 flex flex-col justify-center space-y-6">
                <div class="space-y-6">
                    <div class="flex items-center space-x-3">
                        <div class="h-px w-8 bg-zen-ink opacity-30"></div>
                        <span class="text-xs font-mono uppercase tracking-widest text-zen-ink opacity-60">Music</span>
                    </div>
                    
                    <h1 class="font-serif text-5xl md:text-6xl text-zen-ink leading-[1.1]">
                        Music
                    </h1>
                </div>

                <!-- Text Placeholder -->
                <div class="space-y-4 text-zen-ink max-w-md font-light text-base leading-relaxed">
                    <p class="text-zen-ink/70 italic leading-relaxed">
                        "If you know what you want to do and you do it, that's the work of a craftsman. If you begin with a question and use it to guide an adventure of discovery, that's the work of the artist."
                    </p>
                    <p class="text-zen-ink/50 text-sm">
                        ― Rick Rubin, <em>The Creative Act: A Way of Being</em>
                    </p>
                </div>
            </div>

            <!-- RIGHT COLUMN: Video Stack -->
            <div class="lg:col-span-7 mt-12 lg:mt-0">
                <div class="space-y-6">
                    <div class="video-stack-container">
                        <!-- Video 1 -->
                        <div class="video-stack-item active" data-index="0">
                            <video controls preload="metadata" class="w-full h-full">
                                <source src="video/IMG_9118.mov" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                        
                        <!-- Video 2 -->
                        <div class="video-stack-item" data-index="1">
                            <video controls preload="metadata" class="w-full h-full" style="object-position: bottom;">
                                <source src="video/IMG_0210.mov" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>

                        <!-- Video 3 -->
                        <div class="video-stack-item" data-index="2">
                            <video controls preload="metadata" class="w-full h-full">
                                <source src="video/VID-20190624-WA0009.mov" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>

                        <!-- Video 4 -->
                        <div class="video-stack-item" data-index="3">
                            <video controls preload="metadata" class="w-full h-full">
                                <source src="video/VID-20190525-WA0014.mov" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>

                        <!-- Video 5 -->
                        <div class="video-stack-item" data-index="4">
                            <video controls preload="metadata" class="w-full h-full" style="object-position: bottom;">
                                <source src="video/IMG_0210 2.mov" type="video/mp4">
                                Your browser does not support the video tag.
                            </video>
                        </div>
                    </div>

                    <!-- Navigation Arrows -->
                    <div class="video-nav-arrows">
                        <button class="video-nav-arrow" id="prev-video" aria-label="Previous video">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                            </svg>
                        </button>
                        <button class="video-nav-arrow" id="next-video" aria-label="Next video">
                            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Navigation Dots -->
                    <div class="video-nav-dots">
                        <div class="video-nav-dot active" data-index="0"></div>
                        <div class="video-nav-dot" data-index="1"></div>
                        <div class="video-nav-dot" data-index="2"></div>
                        <div class="video-nav-dot" data-index="3"></div>
                        <div class="video-nav-dot" data-index="4"></div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-6 left-0 w-full text-center pointer-events-none fade-in-up" style="animation-delay: 0.5s;">
        <p class="text-[10px] font-mono uppercase tracking-widest text-zen-ink/30">Cambridge, UK • 2025</p>
    </footer>

    <script>
        // --- 1. MINIMALIST WIREFRAME ANIMATION ---
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        
        const particleCount = 45; 
        const connectionDistance = 200; 
        const mouseDistance = 250; 
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const mouse = { x: null, y: null };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
        });
        window.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.size = Math.random() * 1.5 + 0.5;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;

                if (mouse.x != null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < mouseDistance) {
                        const forceDirectionX = dx / distance;
                        const forceDirectionY = dy / distance;
                        const force = (mouseDistance - distance) / mouseDistance;
                        const direction = 0.015; 
                        this.vx += forceDirectionX * force * direction;
                        this.vy += forceDirectionY * force * direction;
                    }
                }
            }

            draw() {
                ctx.fillStyle = 'rgba(51, 51, 51, 0.4)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < particleCount; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();

                for (let j = i; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx*dx + dy*dy);

                    if (distance < connectionDistance) {
                        ctx.beginPath();
                        const opacity = 1 - (distance / connectionDistance);
                        ctx.strokeStyle = `rgba(51, 51, 51, ${opacity * 0.12})`; 
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // --- 2. VIDEO STACK NAVIGATION ---
        const videoItems = document.querySelectorAll('.video-stack-item');
        const navDots = document.querySelectorAll('.video-nav-dot');
        const prevArrow = document.getElementById('prev-video');
        const nextArrow = document.getElementById('next-video');
        let currentIndex = 0;

        function showVideo(index) {
            // Pause all videos
            videoItems.forEach((item) => {
                const video = item.querySelector('video');
                if (video) {
                    video.pause();
                }
            });

            // Show only 3 cards: the active one + its two closest neighbors.
            // All other videos collapse behind the furthest visible card.
            videoItems.forEach((item, i) => {
                item.classList.remove('active', 'visible-neighbor');
                const distance = Math.abs(i - index);

                if (i === index) {
                    // Active video: front and center
                    item.classList.add('active');
                    item.style.zIndex = 10;
                    item.style.transform = 'translate(0, 0) scale(1)';
                    item.style.opacity = 1;
                    item.style.pointerEvents = 'auto';
                } else if (distance <= 2) {
                    // Two closest neighbors: visible in the stack
                    item.classList.add('visible-neighbor');
                    const slot = distance; // 1 or 2
                    item.style.zIndex = 10 - slot;
                    item.style.transform = `translate(${slot * 20}px, ${slot * 20}px) scale(${1 - slot * 0.05})`;
                    item.style.opacity = 1 - slot * 0.1;
                    item.style.pointerEvents = 'auto';
                } else {
                    // All other videos: collapsed behind the last visible card
                    item.style.zIndex = 0;
                    item.style.transform = 'translate(40px, 40px) scale(0.9)';
                    item.style.opacity = 0;
                    item.style.pointerEvents = 'none';
                }
            });

            // Update navigation dots
            navDots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });

            // Update arrow button states
            if (prevArrow) {
                prevArrow.disabled = index === 0;
            }
            if (nextArrow) {
                nextArrow.disabled = index === videoItems.length - 1;
            }

            currentIndex = index;
        }

        // Click on video to bring to front
        videoItems.forEach((item, index) => {
            item.addEventListener('click', () => {
                showVideo(index);
            });
        });

        // Click on navigation dots
        navDots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                showVideo(index);
            });
        });

        // Arrow button navigation
        if (prevArrow) {
            prevArrow.addEventListener('click', () => {
                if (currentIndex > 0) {
                    showVideo(currentIndex - 1);
                }
            });
        }

        if (nextArrow) {
            nextArrow.addEventListener('click', () => {
                if (currentIndex < videoItems.length - 1) {
                    showVideo(currentIndex + 1);
                }
            });
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' && currentIndex > 0) {
                showVideo(currentIndex - 1);
            } else if (e.key === 'ArrowRight' && currentIndex < videoItems.length - 1) {
                showVideo(currentIndex + 1);
            }
        });

        // Initialize arrow states
        showVideo(0);
    </script>
</body>
</html>
